<app-header (toggleMenu)="menuOpen = !menuOpen" />

<div class="layout">
  <app-sidebar [open]="menuOpen" (navigate)="menuOpen = false" />

  <main class="content">
    <div class="page-head">
      <h1>Panel de productos</h1>
      <p>Administra, consulta y analiza tu catálogo en tiempo real.</p>
    </div>

    <section id="estadisticas"><app-statistics /></section>

    <div class="two-cols">
      <section id="registro"><app-product-form /></section>
      <section id="productos" class="card">
        <h2><i class="bi bi-box-seam"></i> Catálogo</h2>
        <app-product-search />
        <app-product-list />
      </section>
    </div>
  </main>
</div>
